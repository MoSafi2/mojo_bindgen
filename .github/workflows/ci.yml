name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0.8.14
        with:
          cache: true

      - name: Install system libclang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang1

      - name: Validate repository
        run: pixi run --locked check-light
        env:
          # Help libclang find the system shared library on Ubuntu runners.
          LD_LIBRARY_PATH: /usr/lib/x86_64-linux-gnu

  ffi-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0.8.14
        with:
          cache: true
      - name: Install C toolchain
        run: sudo apt-get update && sudo apt-get install -y clang libclang1
      - name: Verify generated FFI on locked Mojo
        run: pixi run --locked pytest -q tests/e2e
        env:
          LD_LIBRARY_PATH: /usr/lib/x86_64-linux-gnu

  native-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.14
        with:
          cache: true
      - name: Install C toolchain for the Python comparison frontend
        run: sudo apt-get update && sudo apt-get install -y clang libclang1
      - name: Install pinned native nightly
        run: pixi install --manifest-path mojo/pixi.toml --locked
      - name: Install locked example headers and runtime libraries
        run: pixi install --manifest-path examples/pixi.toml --locked
      - name: Validate native library and Python parity
        run: pixi run --locked check-native
