[workspace]
name = "mojo-bindgen"
channels = ["conda-forge"]
platforms = ["linux-64"]
requires-pixi = ">=0.80.0"

[environments]
default = { features = ["dev"], solve-group = "main" }
install = { features = [], solve-group = "main" }

[activation.env]
TMPDIR = "$PIXI_PROJECT_ROOT/mojo/build/test-tmp"
MOJO_BINDGEN_EXECUTABLE = "$PIXI_PROJECT_ROOT/mojo/build/payload/bin/mojo-bindgen"
MOJO_BINDGEN_SDK = "$PIXI_PROJECT_ROOT/mojo/.pixi/envs/default"
MOJO_BINDGEN_PATCHELF = "$PIXI_PROJECT_ROOT/mojo/.pixi/envs/package/bin/patchelf"

[dependencies]
python = ">=3.14.4,<3.15"
pip = ">=26.0.1,<27"
rich = ">=15.0.0,<16"
typer = ">=0.25.1,<0.26"

[pypi-dependencies]
mojo-bindgen = { path = ".", editable = true }
build = ">=1.5.0,<2"

[tasks]
test-minimal-install = "python scripts/test_minimal_install.py"
native-exec = "bash scripts/native_exec.sh"
native-build = "pixi run --manifest-path mojo/pixi.toml --locked -e package build"
native-test = "pixi run --manifest-path mojo/pixi.toml --locked test"
native-format-check = "pixi run --manifest-path mojo/pixi.toml --locked format-check"
native-runner-check = "python -I -S scripts/test_native_runner.py"
native-shared = "pixi run --manifest-path mojo/pixi.toml --locked test --suite acceptance"
check-native = { depends-on = ["native-format-check", "native-build", "native-runner-check", "native-test"] }
legacy-test = "pixi run --manifest-path legacy/python/pixi.toml --locked test"
legacy-parity = "pixi run --manifest-path legacy/python/pixi.toml --locked parity"
native-parity = { depends-on = ["legacy-parity"] }
native-example-parity = "pixi run --manifest-path legacy/python/pixi.toml --locked example-parity"
example-zlib = "bash examples/zlib/generate.sh"
example-cairo = "bash examples/cairo/generate.sh"
example-libpng = "bash examples/libpng/generate.sh"
example-sqlite = "bash examples/sqlite/generate.sh"

[feature.dev.dependencies]
nodejs = ">=25.8.2,<25.9"

[feature.dev.pypi-dependencies]
ruff = ">=0.15.12,<0.16"
pyright = ">=1.1.409,<2"

[feature.dev.tasks]
test = "python -m unittest discover -s tests/cli -v"
test-light = { depends-on = ["test", "native-runner-check"] }
lint = "ruff check mojo_bindgen tests/cli tests/distribution scripts hatch_build.py"
format = "ruff format mojo_bindgen tests/cli tests/distribution scripts hatch_build.py"
format-check = "ruff format --check mojo_bindgen tests/cli tests/distribution scripts hatch_build.py"
typecheck = "pyright mojo_bindgen"
check-light = "bash scripts/check-light.sh"
precommit = "bash scripts/pre-commit.sh"
build = "python -m build --outdir dist/release"
build-wheel = "python -m build --wheel --outdir dist/release"
build-sdist = "python -m build --sdist --outdir dist/release"
