[workspace]
name = "mojo-bindgen-examples"
channels = ["conda-forge"]
platforms = ["linux-64"]

# Headers and runtime libraries only. Compilers stay in the root/native manifests.
[dependencies]
cairo = "*"
libpng = "*"
libsqlite = "*"
zlib = "*"
pkg-config = "*"

[tasks]
test-native = "pixi run --manifest-path ../legacy/python/pixi.toml --locked example-parity"
