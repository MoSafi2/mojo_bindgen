[workspace]
name = "mojo-bindgen-native"
version = "0.3.5"
channels = ["https://conda.modular.com/max-nightly/", "conda-forge"]
platforms = ["linux-64"]
requires-pixi = ">=0.80.0"

[dependencies]
mojo = "==1.3.0.dev2026103105"
libclang_mojo = { url = "https://github.com/MoSafi2/mojo_libclang/releases/download/v0.3.0-dev.20261031/libclang_mojo-0.3.0.dev20261031-mojo1_3_0_dev2026103105_linux_64_1.conda", sha256 = "30a0f607d2c41e99a03a1c6fce4ee2d2d386b8185fdc7f2ab7451d41ef6f3f7c" }
clang = "18.*"

[tasks]
build = "bash ../scripts/native_build.sh"
test = "bash ../scripts/native_test.sh"
format = "bash ../scripts/native_format.sh"
format-check = "bash ../scripts/native_format.sh --check"

[feature.package.dependencies]
rattler-build = ">=0.67,<0.68"
python = "3.14.*"

[feature.package.tasks]
package-render = "bash ../scripts/native_package.sh --render-only"
package-build = "bash ../scripts/native_package.sh"

[environments]
default = []
package = ["package"]
