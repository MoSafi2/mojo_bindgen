[workspace]
name = "mojo-bindgen-native"
version = "0.3.5"
channels = ["https://conda.modular.com/max-nightly/", "conda-forge"]
platforms = ["linux-64"]

[dependencies]
mojo = "==1.3.0.dev2026103105"

[tasks]
build = "bash ../scripts/native_build.sh"
test = "bash ../scripts/native_test.sh"
format = "bash ../scripts/native_format.sh"
format-check = "bash ../scripts/native_format.sh --check"

[feature.package.dependencies]
rattler-build = ">=0.67,<0.68"

[feature.package.tasks]
package-render = "rattler-build build --recipe conda.recipe/recipe.yaml --render-only -c https://conda.modular.com/max-nightly/ -c conda-forge"
package-build = "rattler-build build --recipe conda.recipe/recipe.yaml --output-dir build/conda -c https://conda.modular.com/max-nightly/ -c conda-forge"

[environments]
default = []
package = ["package"]
